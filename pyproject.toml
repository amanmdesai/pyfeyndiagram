[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfeyndiagram"
dynamic = ["version"]
description = "Tree-level Standard Model Feynman diagram generator with PDF and TikZ-Feynman output"
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib"]

[project.scripts]
pyfeyndiagram = "pyfeyndiagram.cli:main"

[tool.setuptools]
packages = ["pyfeyndiagram"]

[tool.setuptools.dynamic]
version = {attr = "pyfeyndiagram.__version__"}
